name: Release

run-name: Release ${{ inputs.version }}

# Manual on purpose: releases are cut by hand from the Actions tab or with
#   gh workflow run release.yml -f version=v0.1.0
#
# Publishes:
#   - ghcr.io/c0ze/armarium:<version> and :latest (linux/amd64, linux/arm64)
#   - docker.io/coze/armarium:<version> and :latest, when DOCKERHUB_USERNAME and
#     DOCKERHUB_TOKEN secrets are set
#   - a GitHub release tagged <version> with static binaries and checksums

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v0.1.0
        required: true

permissions:
  contents: write   # tag and release
  packages: write   # push to ghcr.io

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      HAS_HUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "version must look like v1.2.3"; exit 1; }

      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run check && npm test && npm run build)
          go vet ./...
          go test -race ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            name="armarium_${VERSION#v}_${os}_${arch}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/armarium$ext" ./cmd/armarium
            cp LICENSE README.md deploy/armarium.example.toml "dist/$name/"
            if [ "$os" = windows ]; then (cd dist && zip -qr "$name.zip" "$name"); else tar -C dist -czf "dist/$name.tar.gz" "$name"; fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.HAS_HUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          tags="ghcr.io/c0ze/armarium:$VERSION,ghcr.io/c0ze/armarium:latest"
          [ "$HAS_HUB" = true ] && tags="$tags,docker.io/coze/armarium:$VERSION,docker.io/coze/armarium:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ inputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/c0ze/armarium
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
          push: true

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
