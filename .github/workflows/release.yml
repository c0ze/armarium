name: Release

run-name: Release ${{ inputs.version }}

# Manual on purpose: releases are cut by hand from the Actions tab or with
#   gh workflow run release.yml -f version=v0.1.0
#
# Publishes:
#   - ghcr.io/c0ze/armarium:<version> and :latest (linux/amd64, linux/arm64)
#   - docker.io/coze/armarium:<version> and :latest, when DOCKERHUB_USERNAME and
#     DOCKERHUB_TOKEN secrets are set
#   - a draft GitHub release with Linux/Windows binaries, the Windows installer
#     (Armarium-Setup-<X.Y.Z>-x64.exe) and checksums
# macOS (Armarium.app in a DMG) is built, signed, notarized and stapled on the
# signing Mac, then uploaded before publishing the draft. See docs/releasing.md.
#
# Windows code signing is ready but off: set the repository variable
# WINDOWS_SIGNING to "azure" once Azure Artifact Signing is set up (variables
# AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE and
# secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID for OIDC).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v0.1.0
        required: true

permissions:
  contents: write   # tag and release
  packages: write   # push to ghcr.io

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # only used by Azure Artifact Signing (OIDC), when switched on
    env:
      VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "version must look like v1.2.3"; exit 1; }

      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build Armarium.exe and the command line
        run: |
          v=${VERSION#v}; num=${v%%-*}
          go run github.com/tc-hib/go-winres@v0.3.3 make --in cmd/armarium-desktop/winres/winres.json \
            --out cmd/armarium-desktop/rsrc --arch amd64 --product-version "$num" --file-version "$num"
          mkdir -p dist/windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=$VERSION" -o dist/windows/Armarium.exe ./cmd/armarium-desktop
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" -o dist/windows/armarium.exe ./cmd/armarium
          dist/windows/armarium.exe version

      - name: Log in to Azure (signing)
        if: vars.WINDOWS_SIGNING == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the programs
        if: vars.WINDOWS_SIGNING == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: dist/windows
          files-folder-filter: exe

      - name: Build the installer
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || { choco install innosetup -y --no-progress; }
          # Git Bash would rewrite ISCC's /D options as paths.
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' "$iscc" "/DMyAppVersion=${VERSION#v}" "/DSourceDir=..\..\dist\windows" packaging/windows/armarium.iss
          ls -l dist/Armarium-Setup-*.exe

      - name: Sign the installer
        if: vars.WINDOWS_SIGNING == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          files-folder-depth: 1

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/Armarium-Setup-*.exe
          if-no-files-found: error

  release:
    needs: windows-installer
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      HAS_HUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "version must look like v1.2.3"; exit 1; }

      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run check && npm test && npm run build)
          go vet ./...
          go test -race ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            name="armarium_${VERSION#v}_${os}_${arch}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/armarium$ext" ./cmd/armarium
            cp LICENSE README.md deploy/armarium.example.toml "dist/$name/"
            if [ "$os" = windows ]; then (cd dist && zip -qr "$name.zip" "$name"); else tar -C dist -czf "dist/$name.tar.gz" "$name"; fi
          done

      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist

      - name: Checksums
        run: (cd dist && sha256sum -- *.tar.gz *.zip Armarium-Setup-*.exe > checksums.txt)

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.HAS_HUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          tags="ghcr.io/c0ze/armarium:$VERSION,ghcr.io/c0ze/armarium:latest"
          [ "$HAS_HUB" = true ] && tags="$tags,docker.io/coze/armarium:$VERSION,docker.io/coze/armarium:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ inputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/c0ze/armarium
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
          push: true

      - name: Draft GitHub release (awaiting the signed macOS DMG)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --draft --target "$GITHUB_SHA" --title "$VERSION" --generate-notes \
            dist/*.tar.gz dist/*.zip dist/Armarium-Setup-*.exe dist/checksums.txt
