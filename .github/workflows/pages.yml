name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Point the download links at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          python3 - "$version" site/index.html <<'PY'
          import re, sys
          tag, path = sys.argv[1], sys.argv[2]
          base = f"https://github.com/c0ze/armarium/releases/download/{tag}/"
          s = open(path, encoding="utf-8").read()
          s, links = re.subn(r'href="[^"]*" data-asset="([^"]+)"',
                             lambda m: f'href="{base}{m.group(1).format(v=tag.lstrip("v"))}"', s)
          s, labels = re.subn(r'(<span data-release-version>)[^<]*', rf'\g<1>{tag}', s)
          if links < 5 or labels < 1:
              sys.exit(f"expected 5 download links and a version label, found {links} and {labels}")
          open(path, "w", encoding="utf-8").write(s)
          print(f"download links point at {tag}")
          PY
      - name: Upload the static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
